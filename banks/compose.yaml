name: horizonte-banks
services:
  banks-db:
    image: postgres:18@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: bank_owner
      POSTGRES_PASSWORD: local-bank
    volumes:
      - banks-data:/var/lib/postgresql
    networks: [banks-private]
    healthcheck:
      test: [CMD, pg_isready, -U, bank_owner, -d, bank]
      interval: 3s
      timeout: 3s
      retries: 30
  bank-simulator:
    build: .
    init: true
    environment:
      BANK_DB: postgres://bank_owner:local-bank@banks-db/bank
      OTEL_SERVICE_NAME: bank-simulator
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:${BANKS_PORT:-3012}:3012"
    networks: [default, banks-private]
    depends_on:
      banks-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3012/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  banks-data:
networks:
  banks-private:
    internal: true
