name: horizonte-accounts
services:
  accounts-db:
    image: postgres:18@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    environment:
      POSTGRES_DB: accounts
      POSTGRES_USER: accounts_owner
      POSTGRES_PASSWORD: local-accounts
    volumes:
      - accounts-data:/var/lib/postgresql
    networks: [accounts-private]
    healthcheck:
      test: [CMD, pg_isready, -U, accounts_owner, -d, accounts]
      interval: 3s
      timeout: 3s
      retries: 30
  accounts-service:
    build: .
    init: true
    environment:
      ACCOUNTS_DB: postgres://accounts_owner:local-accounts@accounts-db/accounts
      OTEL_SERVICE_NAME: accounts-service
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:${ACCOUNTS_PORT:-3011}:3011"
    networks: [default, accounts-private]
    depends_on:
      accounts-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3011/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  accounts-data:
networks:
  accounts-private:
    internal: true
